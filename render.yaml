# Blueprint Render: https://dashboard.render.com/blueprints
# Conectar repo GitHub → New Blueprint → seleccionar este archivo.
# Somee: misma instancia que MatrizPonderada (GIA_DB_PoC.mssql.somee.com).
services:
  - type: web
    name: sga-alquileres-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/meta
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx350m
      - key: SGA_DB_URL
        value: jdbc:sqlserver://GIA_DB_PoC.mssql.somee.com:1433;databaseName=GIA_DB_PoC;encrypt=true;trustServerCertificate=true;packetSize=4096
      - key: SGA_DB_USER
        value: jppirra_SQLLogin_1
      - key: SGA_DB_PASSWORD
        sync: false
      - key: SGA_CORS_ORIGINS
        value: https://*.vercel.app
