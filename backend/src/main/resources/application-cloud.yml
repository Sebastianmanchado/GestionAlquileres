# Perfil CLOUD: Somee / Render / etc.
# Obligatorias: SGA_DB_URL, SGA_DB_USER, SGA_DB_PASSWORD, SGA_CORS_ORIGINS
spring:
  datasource:
    url: ${SGA_DB_URL}
    username: ${SGA_DB_USER}
    password: ${SGA_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    # Base compartida con MatrizPonderada (GIA_DB_PoC): ya tiene tablas ajenas.
    # baseline-version=0 evita que Flyway saltee V1__schema; tabla propia evita historial corrupto.
    table: flyway_schema_history_sga
    baseline-on-migrate: true
    baseline-version: 0
    # POC: schema + seed de demo. Cuando haya datos reales, dejar solo classpath:db/migration.
    locations: classpath:db/migration,classpath:db/seed

sga:
  cors:
    # Wildcard cubre producción y previews de Vercel. Podés agregar más orígenes separados por coma.
    allowed-origins: ${SGA_CORS_ORIGINS:https://*.vercel.app}
  storage:
    root: ${SGA_STORAGE_ROOT:/tmp/sga-storage}

logging:
  level:
    com.correoargentino.sga: info
    org.flywaydb: info
