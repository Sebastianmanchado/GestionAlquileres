server:
  # Render inyecta PORT; local usa SERVER_PORT o 8080.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: sga-alquileres
  # Carga opcional de .env en la raíz del repo (mismo patrón que MatrizPonderada).
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  # Perfil activo: local (por defecto) | cloud. Se puede pisar con SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Las 'locations' se definen por perfil (schema siempre; seed solo donde corresponda).

sga:
  storage:
    root: ${SGA_STORAGE_ROOT:./storage}
  # Rol local del MVP (mientras no hay Keycloak): ANALISTA | SUPERVISOR | AUDITOR
  local-role: ${SGA_LOCAL_ROLE:ANALISTA}
  cors:
    # Origenes permitidos para el frontend, separados por coma.
    allowed-origins: ${SGA_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
  ajustes:
    enabled: ${SGA_AJUSTES_AUTO:true}
    cron: "${SGA_AJUSTES_CRON:0 30 6 * * *}"
    zone: ${SGA_AJUSTES_ZONE:America/Argentina/Buenos_Aires}
    ipc-series-url: https://apis.datos.gob.ar/series/api/series/
    # v2.0 de Estadísticas BCRA responde 410. La serie vigente del ICL (variable 40) está en v4.0.
    icl-base-url: https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/

springdoc:
  swagger-ui:
    path: /swagger

logging:
  level:
    org.flywaydb: info
