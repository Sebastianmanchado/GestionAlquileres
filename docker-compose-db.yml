services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sga-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sga-sqlserver-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"

    entrypoint:
        - /bin/bash
        - -c
        - |
          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -Q "IF DB_ID('sga') IS NULL CREATE DATABASE sga"

volumes:
  sqlserver_data: